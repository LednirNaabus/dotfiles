# to reload tmux configuration file
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux configuration reloaded."

# set PS1 prompt to appropriate color
#set -g default-terminal "xterm-256color"
set -g default-terminal "tmux-256color"

# set tmux prefix from Ctrl+b to a new one
set -g prefix C-s

# statusbar
set -g status-position top
set -g status-justify left
set -g status-left ''
set -g status-left-length 10
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

# List of plugins
set -g @plugin 'tmux-plugins/tpm' # plugin manager
set -g @plugin 'tmux-plugins/tmux-resurrect' # save sessions

# set mouse scroll wheel
set -g mouse on

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# set path where to save tmux-resurrect sessions
set -g @resurrect-dir '~/.tmux/sessions'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
